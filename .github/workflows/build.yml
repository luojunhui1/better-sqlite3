permissions:
  contents: write

name: build

on:
  release:
    types:
      - released

env:
  # Electron 42.1.0 maps to ABI v146. Build only the Windows release assets we care about.
  # `node-ninja` generates an MSBuild solution that delegates compilation to ninja/clang-cl.
  ELECTRON_BUILD_CMD_RELEASE_WINDOWS: npx --no-install prebuild -r electron -t 42.1.0 --backend node-ninja --format msvs-ninja --include-regex 'better_sqlite3.node$' --verbose
  PYTHON2_DIR: C:\Python27
  PYTHON2_EXE: C:\Python27\python.exe

jobs:
  prebuild-windows:
    if: ${{ github.event_name == 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: amd64
          - arch: ia32
            msvc_arch: amd64_x86
          - arch: arm64
            msvc_arch: amd64_arm64
    name: Prebuild on Windows Electron 42 (${{ matrix.arch }})
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Export Visual Studio 2022 override for node-ninja
        shell: pwsh
        run: |
          $vsPath = $env:VSINSTALLDIR.TrimEnd('\')
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GYP_MSVS_OVERRIDE_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Visual Studio override path: $vsPath"
      - name: Prepare Windows toolchain PATH
        shell: pwsh
        run: |
          $llvmBin = Join-Path ${env:ProgramFiles} 'LLVM\bin'
          if ((Test-Path (Join-Path $llvmBin 'clang-cl.exe')) -and -not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Added LLVM to PATH: $llvmBin"
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $ninja = Get-ChildItem -Path ${env:ProgramFiles}, ${env:ProgramData} -Filter ninja.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($ninja) {
              Split-Path $ninja.FullName -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Added Ninja to PATH: $($ninja.FullName)"
            }
          }
      - run: pip.exe install setuptools
      - name: Install Python 2.7 for node-ninja
        shell: pwsh
        run: |
          $pythonExe = "${{ env.PYTHON2_EXE }}"
          if (-not (Test-Path $pythonExe)) {
            $installer = Join-Path $env:RUNNER_TEMP 'python-2.7.18.amd64.msi'
            Invoke-WebRequest 'https://www.python.org/ftp/python/2.7.18/python-2.7.18.amd64.msi' -OutFile $installer
            Start-Process msiexec.exe -Wait -NoNewWindow -ArgumentList @(
              '/i', $installer,
              '/qn',
              'TARGETDIR=C:\Python27',
              'ALLUSERS=1'
            )
          }
          "${{ env.PYTHON2_DIR }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "${{ env.PYTHON2_DIR }}\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PYTHON=${{ env.PYTHON2_EXE }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_python=${{ env.PYTHON2_EXE }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $pythonExe -V
      - run: npm install --ignore-scripts
      - name: Patch node-ninja for Visual Studio 2022
        shell: pwsh
        run: |
          $script = @'
          const fs = require('fs');
          const msvsVersionPath = 'node_modules/node-ninja/gyp/pylib/gyp/MSVSVersion.py';
          let source = fs.readFileSync(msvsVersionPath, 'utf8');

          if (!source.includes("'2022': VisualStudioVersion('2022'")) {
            source = source.replace(
              "  versions = {\n      '2015': VisualStudioVersion('2015',",
              "  versions = {\n      '2022': VisualStudioVersion('2022',\n                                  'Visual Studio 2022',\n                                  solution_version='12.00',\n                                  project_version='17.0',\n                                  flat_sln=False,\n                                  uses_vcxproj=True,\n                                  path=path,\n                                  sdk_based=sdk_based,\n                                  default_toolset='v143'),\n      '2015': VisualStudioVersion('2015',"
            );
          }

          if (!source.includes("      '17.0': '2022',")) {
            source = source.replace(
              "  version_to_year = {\n      '8.0': '2005',",
              "  version_to_year = {\n      '17.0': '2022',\n      '8.0': '2005',"
            );
          }

          if (!source.includes("    '2022': ('17.0',),")) {
            source = source.replace(
              "  version_map = {\n    'auto': ('14.0', '12.0', '10.0', '9.0', '8.0', '11.0'),",
              "  version_map = {\n    'auto': ('17.0', '14.0', '12.0', '10.0', '9.0', '8.0', '11.0'),"
            );
            source = source.replace(
              "    '2015': ('14.0',),",
              "    '2015': ('14.0',),\n    '2022': ('17.0',),"
            );
          }

          const setupScriptNeedle = "    assert target_arch in ('x86', 'x64')\n    sdk_dir = os.environ.get('WindowsSDKDir')";
          if (source.includes(setupScriptNeedle) && !source.includes("VC/Auxiliary/Build/vcvarsall.bat")) {
            source = source.replace(
              setupScriptNeedle,
              "    assert target_arch in ('x86', 'x64')\n    if self.short_name >= '2017':\n      script_path = os.path.normpath(\n          os.path.join(self.path, 'VC/Auxiliary/Build/vcvarsall.bat'))\n      is_host_arch_x64 = (\n          os.environ.get('PROCESSOR_ARCHITECTURE') == 'AMD64' or\n          os.environ.get('PROCESSOR_ARCHITEW6432') == 'AMD64')\n      host_arch = 'amd64' if is_host_arch_x64 else 'x86'\n      msvc_target_arch = 'amd64' if target_arch == 'x64' else 'x86'\n      arg = host_arch\n      if host_arch != msvc_target_arch:\n        arg += '_' + msvc_target_arch\n      return [script_path, arg]\n    sdk_dir = os.environ.get('WindowsSDKDir')"
            );
          }

          fs.writeFileSync(msvsVersionPath, source);

          const addonGypiPath = 'node_modules/node-ninja/addon.gypi';
          let addonGypi = fs.readFileSync(addonGypiPath, 'utf8');
          if (!addonGypi.includes("'standalone_static_library%': 1")) {
            addonGypi = addonGypi.replace(
              "{\n  'target_defaults': {",
              "{\n  'variables': {\n    'standalone_static_library%': 1,\n  },\n  'target_defaults': {"
            );
          }
          fs.writeFileSync(addonGypiPath, addonGypi);

          const buildJsPath = 'node_modules/node-ninja/lib/build.js';
          let buildJs = fs.readFileSync(buildJsPath, 'utf8');
          const buildNeedle = "  function doBuild () {\n\n    // Enable Verbose build";
          if (buildJs.includes(buildNeedle) && !buildJs.includes("argv = argv.filter(function (arg, index) {")) {
            buildJs = buildJs.replace(
              buildNeedle,
              "  function doBuild () {\n\n    if (win) {\n      argv = argv.filter(function (arg, index) {\n        return arg !== '--format' && argv[index - 1] !== '--format'\n      })\n    }\n\n    // Enable Verbose build"
            );
          }
          fs.writeFileSync(buildJsPath, buildJs);

          console.log('Patched node-ninja for Visual Studio 2022, standalone_static_library, and msbuild args');
          '@
          node -e $script
      - name: Patch prebuild for node-ninja
        shell: pwsh
        run: |
          $script = @'
          const fs = require('fs');
          const path = 'node_modules/prebuild/gyp.js';
          const source = fs.readFileSync(path, 'utf8');
          const pattern = /(\s*)gyp\.commands\[command\.name\]\(command\.args\)\.then\(function \(\) \{\s*\n\s*log\.verbose\('ok'\)\s*\n\s*process\.nextTick\(runStep\)\s*\n\s*\}, function \(err\) \{\s*\n\s*log\.error\(command\.name \+ ' error'\)\s*\n\s*log\.error\('stack', err\.stack\)\s*\n\s*log\.error\('not ok'\)\s*\n\s*return cb\(err\)\s*\n\s*\}\)/m;
          if (!pattern.test(source)) {
            throw new Error('Expected prebuild gyp.js pattern not found');
          }
          const replacement = [
            '$1var result',
            '$1if (gyp.commands[command.name].length >= 2) {',
            '$1  result = new Promise(function (resolve, reject) {',
            '$1    gyp.commands[command.name](command.args, function (err) {',
            '$1      if (err) return reject(err)',
            '$1      resolve()',
            '$1    })',
            '$1  })',
            '$1} else {',
            '$1  result = gyp.commands[command.name](command.args)',
            '$1}',
            '$1',
            '$1result.then(function () {',
            '$1  log.verbose(\'ok\')',
            '$1  process.nextTick(runStep)',
            '$1}, function (err) {',
            '$1  log.error(command.name + \' error\')',
            '$1  log.error(\'stack\', err.stack)',
            '$1  log.error(\'not ok\')',
            '$1  return cb(err)',
            '$1})'
          ].join('\n');
          const replaced = source.replace(pattern, replacement);
          fs.writeFileSync(path, replaced);
          console.log('Patched prebuild/gyp.js for callback backends');
          '@
          node -e $script
      - name: Clean previous build outputs
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path prebuilds) { Remove-Item prebuilds -Recurse -Force }
      - name: Verify Windows toolchain
        # Keep pwsh here: bash prepends GNU paths that can shadow link.exe from MSVC.
        shell: pwsh
        run: |
          $clang = Get-Command clang-cl -ErrorAction SilentlyContinue
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if ($clang) {
            Write-Host "clang-cl: $($clang.Source)"
            clang-cl --version
          } else {
            Write-Host "clang-cl was not found on PATH."
          }
          if ($ninja) {
            Write-Host "ninja: $($ninja.Source)"
            ninja --version
          } else {
            Write-Host "ninja was not found on PATH."
          }
      - name: Build Windows Electron 42 prebuild
        shell: pwsh
        env:
          CC: clang-cl
          CXX: clang-cl
          CC_target: clang-cl
          CXX_target: clang-cl
          npm_config_msvs_version: 2022
        run: |
          ${{ env.ELECTRON_BUILD_CMD_RELEASE_WINDOWS }} --arch ${{ matrix.arch }}
      - name: List produced prebuilds
        if: always()
        shell: pwsh
        run: |
          if (Test-Path prebuilds) {
            Get-ChildItem prebuilds -File | Format-Table Name, Length
          } else {
            Write-Host "No prebuilds directory was produced."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-windows-${{ matrix.arch }}
          path: prebuilds/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: diagnostics-windows-${{ matrix.arch }}
          path: build/**/*
          if-no-files-found: ignore
  upload-release-assets:
    if: >-
      ${{
        github.event_name == 'release' &&
        always() &&
        needs.prebuild-windows.result == 'success'
      }}
    name: Upload Windows v146 release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - prebuild-windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-windows-*
          path: release-assets
          merge-multiple: true
      - run: ls -lh release-assets
      - env:
          # Prefer a user PAT for fork/release uploads; fall back to the workflow token when no secret is configured.
          GH_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN || github.token }}
          # The upload job only downloads artifacts; it does not check out the repository.
          # Tell gh which repository to target so it does not try to inspect a local .git directory.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-assets/*.tar.gz --clobber
