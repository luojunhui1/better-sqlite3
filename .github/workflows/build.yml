permissions:
  contents: write

name: build

on:
  release:
    types:
      - released

env:
  # Electron 42.1.0 maps to ABI v146. Build only the Windows release assets we care about.
  # Use the modern `node-gyp` backend already bundled in devDependencies.
  ELECTRON_BUILD_CMD_RELEASE_WINDOWS: npx --no-install prebuild -r electron -t 42.1.0 --backend node-gyp --include-regex 'better_sqlite3.node$' --verbose

jobs:
  prebuild-windows:
    if: ${{ github.event_name == 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: amd64
          - arch: ia32
            msvc_arch: amd64_x86
          - arch: arm64
            msvc_arch: amd64_arm64
    name: Prebuild on Windows Electron 42 (${{ matrix.arch }})
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Export Visual Studio 2022 settings
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_python=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Python: $python"
      - run: npm install --ignore-scripts
      - name: Disable test_extension target for prebuild release
        shell: pwsh
        run: |
          $script = @'
          const fs = require('fs');
          const path = 'binding.gyp';
          const source = fs.readFileSync(path, 'utf8');
          const eol = source.includes('\r\n') ? '\r\n' : '\n';
          const normalized = source.replace(/\r\n/g, '\n');
          const pattern = /,\s*\{\s*'target_name': 'test_extension'[\s\S]*?\n\s*\},\n(?=\s*\],\n\s*\})/m;
          if (!pattern.test(normalized)) {
            throw new Error('Expected test_extension target not found in binding.gyp');
          }
          const updated = normalized.replace(pattern, '\n').replace(/\n/g, eol);
          fs.writeFileSync(path, updated);
          console.log('Removed test_extension target from CI prebuild');
          '@
          node -e $script
      - name: Clean previous build outputs
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path prebuilds) { Remove-Item prebuilds -Recurse -Force }
      - name: Verify tool versions
        shell: pwsh
        run: |
          node --version
          npm --version
          python --version
          node -p "require('./node_modules/node-gyp/package.json').version"
      - name: Build Windows Electron 42 prebuild
        shell: pwsh
        env:
          npm_config_msvs_version: 2022
        run: |
          ${{ env.ELECTRON_BUILD_CMD_RELEASE_WINDOWS }} --arch ${{ matrix.arch }}
      - name: List produced prebuilds
        if: always()
        shell: pwsh
        run: |
          if (Test-Path prebuilds) {
            Get-ChildItem prebuilds -File | Format-Table Name, Length
          } else {
            Write-Host "No prebuilds directory was produced."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-windows-${{ matrix.arch }}
          path: prebuilds/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: diagnostics-windows-${{ matrix.arch }}
          path: build/**/*
          if-no-files-found: ignore
  upload-release-assets:
    if: >-
      ${{
        github.event_name == 'release' &&
        always() &&
        needs.prebuild-windows.result == 'success'
      }}
    name: Upload Windows v146 release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - prebuild-windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-windows-*
          path: release-assets
          merge-multiple: true
      - run: ls -lh release-assets
      - env:
          # Prefer a user PAT for fork/release uploads; fall back to the workflow token when no secret is configured.
          GH_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN || github.token }}
          # The upload job only downloads artifacts; it does not check out the repository.
          # Tell gh which repository to target so it does not try to inspect a local .git directory.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-assets/*.tar.gz --clobber
