permissions:
  contents: write

name: build

on:
  release:
    types:
      - released
  workflow_dispatch: {}

env:
  ELECTRON_BUILD_CMD_RELEASE: npx --no-install prebuild -r electron -t 42.1.0 --include-regex 'better_sqlite3.node$'
  # Electron 42 headers require ClangCL on Windows, but node-gyp currently drives MSBuild with cl.exe.
  # Keep Windows release assets on the last known-good modern Electron range until that toolchain path is fixed.
  ELECTRON_BUILD_CMD_RELEASE_WINDOWS: npx --no-install prebuild -r electron -t 39.0.0 -t 40.0.0 -t 41.0.0 --include-regex 'better_sqlite3.node$'

jobs:
  prebuild-macos:
    if: ${{ github.event_name == 'release' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
    name: Prebuild on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: brew install python-setuptools
      - run: npm install --ignore-scripts
      - run: ${{ env.ELECTRON_BUILD_CMD_RELEASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.os }}
          path: prebuilds/*.tar.gz
          if-no-files-found: error

  prebuild-linux-x64:
    if: ${{ github.event_name == 'release' }}
    name: Prebuild on Linux x64
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: npm install --ignore-scripts
      - run: ${{ env.ELECTRON_BUILD_CMD_RELEASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux-x64
          path: prebuilds/*.tar.gz
          if-no-files-found: error

  prebuild-linux-arm64:
    if: ${{ github.event_name == 'release' }}
    name: Prebuild on Linux arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - run: |
          docker run --rm -v $(pwd):/tmp/project --entrypoint /bin/sh --platform linux/arm64 node:20-bookworm -c "\
          cd /tmp/project && \
          npm install --ignore-scripts && \
          ${{ env.ELECTRON_BUILD_CMD_RELEASE }} --arch arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux-arm64
          path: prebuilds/*.tar.gz
          if-no-files-found: error

  prebuild-windows:
    if: ${{ github.event_name == 'release' }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - ia32
          - arm64
    name: Prebuild on Windows (${{ matrix.arch }})
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip.exe install setuptools
      - run: npm install --ignore-scripts
      - run: ${{ env.ELECTRON_BUILD_CMD_RELEASE_WINDOWS }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-windows-${{ matrix.arch }}
          path: prebuilds/*.tar.gz
          if-no-files-found: error

  upload-release-assets:
    if: ${{ github.event_name == 'release' }}
    name: Upload release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - prebuild-macos
      - prebuild-linux-x64
      - prebuild-linux-arm64
      - prebuild-windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: release-assets
          merge-multiple: true
      - run: ls -lh release-assets
      - env:
          # Prefer a user PAT for fork/release uploads; fall back to the workflow token when no secret is configured.
          GH_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN || github.token }}
          # The upload job only downloads artifacts; it does not check out the repository.
          # Tell gh which repository to target so it does not try to inspect a local .git directory.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-assets/*.tar.gz --clobber
